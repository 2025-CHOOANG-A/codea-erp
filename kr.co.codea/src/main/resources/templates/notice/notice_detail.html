<div th:fragment="contentFragment">

    <th:block th:fragment="headFragment">
        <style>
            body {
                min-height: 100vh;
                background: #f8f9fa;
            }
            .main-content {
                max-width: 1000px;
                margin: 0 auto;
                padding: 64px 0.75rem 0;
            }
            .notice-header {
                background: #fff;
                border-radius: 0.5rem;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03);
                padding: 2rem;
                margin-bottom: 1.5rem;
            }
            .notice-meta {
                display: flex;
                gap: 2rem;
                margin-top: 1rem;
                padding-top: 1rem;
                border-top: 1px solid #e9ecef;
                color: #6c757d;
                font-size: 0.9rem;
            }
            .notice-content {
                background: #fff;
                border-radius: 0.5rem;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03);
                padding: 2rem;
                margin-bottom: 1.5rem;
                min-height: 300px;
                line-height: 1.8;
            }
            .notice-actions {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            @media (max-width: 767.98px) {
                .main-content { padding: 64px 0.3rem 0; }
                .notice-header, .notice-content { padding: 1.5rem; }
                .notice-meta { 
                    flex-direction: column; 
                    gap: 0.5rem;
                }
                .notice-actions {
                    flex-direction: column;
                    gap: 1rem;
                    align-items: stretch;
                }
            }
        </style>
    </th:block>

    <main class="main-content">
        <div class="container">
            <!-- 공지사항 헤더 -->
            <div class="notice-header">
                <h1 class="mb-0" th:text="${notice.title}">공지사항 제목</h1>
                <div class="notice-meta">
                    <div>
                        <i class="bi bi-person-circle me-1"></i>
                        <span th:text="${notice.authorName ?: '관리자'}">작성자</span>
                    </div>
                    <div>
                        <i class="bi bi-calendar3 me-1"></i>
                        <span th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd HH:mm')}">작성일</span>
                    </div>
                    <div>
                        <i class="bi bi-eye me-1"></i>
                        <span th:text="'조회수 ' + ${notice.views}">조회수</span>
                    </div>
                    <div th:if="${notice.updatedAt != null and !#temporals.format(notice.createdAt, 'yyyy-MM-dd HH:mm').equals(#temporals.format(notice.updatedAt, 'yyyy-MM-dd HH:mm'))}">
                        <i class="bi bi-pencil-square me-1"></i>
                        <span th:text="'수정일 ' + ${#temporals.format(notice.updatedAt, 'yyyy-MM-dd HH:mm')}">수정일</span>
                    </div>
                </div>
            </div>

            <!-- 공지사항 내용 -->
            <div class="notice-content">
                <div th:utext="${#strings.replace(notice.content, newlineChar, '&lt;br&gt;')}" 
                     th:with="newlineChar=${T(java.lang.System).getProperty('line.separator')}">
                    공지사항 내용이 여기에 표시됩니다.
                </div>
            </div>

            <!-- 액션 버튼들 -->
            <div class="notice-actions">
                <div>
                    <a href="/notice/list" class="btn btn-outline-secondary">
                        <i class="bi bi-list"></i> 목록으로
                    </a>
                </div>
                
                <div sec:authorize="hasRole('ROLE_ADMIN')">
                    <a th:href="@{/notice/{id}/edit(id=${notice.noticeId})}" 
                       class="btn btn-outline-primary me-2">
                        <i class="bi bi-pencil"></i> 수정
                    </a>
                    <button type="button" 
                            class="btn btn-outline-danger" 
                            onclick="deleteNotice()">
                        <i class="bi bi-trash"></i> 삭제
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- 삭제 확인 스크립트 -->
    <script th:inline="javascript">
        function deleteNotice() {
            if (confirm('정말로 이 공지사항을 삭제하시겠습니까?')) {
                const noticeId = /*[[${notice.noticeId}]]*/ 0;
                
                fetch(`/notice/${noticeId}/delete`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('공지사항이 삭제되었습니다.');
                        window.location.href = '/notice/list';
                    } else {
                        alert('삭제에 실패했습니다: ' + data.message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('삭제 중 오류가 발생했습니다.');
                });
            }
        }
    </script>

</div>
