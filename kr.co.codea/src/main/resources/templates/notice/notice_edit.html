<div th:fragment="contentFragment">

    <th:block th:fragment="headFragment">
        <style>
            body {
                background: #ffffff;
            }
            .main-content {
                padding: 64px 1rem 0;
            }
            .notice-header {
                padding: 1.5rem 0;
                border-bottom: 1px solid #dee2e6;
                margin-bottom: 1.5rem;
            }
            .notice-meta {
                display: flex;
                gap: 1.5rem;
                margin-top: 0.5rem;
                color: #6c757d;
                font-size: 0.9rem;
            }
            .edit-form {
                padding: 1.5rem 0;
            }
            .form-label {
                font-weight: 600;
                color: #333;
                margin-bottom: 0.75rem;
            }
            .content-textarea {
                min-height: 500px;
                resize: vertical;
                font-family: inherit;
                line-height: 1.6;
            }
            .form-actions {
                display: flex;
                justify-content: center;
                gap: 1rem;
                margin-top: 2rem;
                padding-top: 1.5rem;
                border-top: 1px solid #e9ecef;
            }
            @media (max-width: 767.98px) {
                .main-content { 
                    padding: 64px 0.5rem 0; 
                }
                .notice-meta { 
                    flex-direction: column; 
                    gap: 0.3rem;
                }
                .form-actions {
                    flex-direction: column;
                }
                .content-textarea {
                    min-height: 400px;
                }
            }
        </style>
    </th:block>

    <main class="main-content">
        <div class="container-fluid">
            <!-- 공지사항 헤더 -->
            <div class="notice-header">
                <h3 class="mb-3" th:text="${notice.title}">공지사항 제목</h3>
                <div class="notice-meta">
                    <span>작성자: <span th:text="${notice.authorName ?: '관리자'}">작성자</span></span>
                    <span>작성일: <span th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd HH:mm')}">작성일</span></span>
                    <span>조회수: <span th:text="${notice.views}">조회수</span></span>
                    <span th:if="${notice.updatedAt != null and !#temporals.format(notice.createdAt, 'yyyy-MM-dd HH:mm').equals(#temporals.format(notice.updatedAt, 'yyyy-MM-dd HH:mm'))}">
                        수정일: <span th:text="${#temporals.format(notice.updatedAt, 'yyyy-MM-dd HH:mm')}">수정일</span>
                    </span>
                </div>
            </div>

            <div class="edit-form">
                <form th:action="@{/notice/{id}/edit(id=${notice.noticeId})}" method="post" th:object="${notice}">
                    <!-- 제목 수정 -->
                    <div class="mb-4">
                        <label for="title" class="form-label">제목</label>
                        <input type="text" 
                               class="form-control" 
                               id="title" 
                               name="title"
                               th:field="*{title}"
                               placeholder="공지사항 제목을 입력하세요"
                               required 
                               maxlength="200" />
                    </div>

                    <!-- 내용 수정 -->
                    <div class="mb-4">
                        <label for="content" class="form-label">내용</label>
                        <textarea class="form-control content-textarea" 
                                  id="content" 
                                  name="content"
                                  th:field="*{content}"
                                  placeholder="공지사항 내용을 입력하세요"
                                  required></textarea>
                        <div class="form-text">
                            줄바꿈은 자동으로 적용됩니다.
                        </div>
                    </div>

                    <!-- 수정자 정보 (읽기 전용) -->
                    <div class="mb-4">
                        <label class="form-label">수정자</label>
                        <input type="text" 
                               class="form-control" 
                               th:value="${notice.authorName ?: '관리자'}" 
                               readonly />
                    </div>

                    <!-- 버튼 영역 -->
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">
                            수정하기
                        </button>
                        <a th:href="@{/notice/{id}(id=${notice.noticeId})}" 
                           class="btn btn-outline-secondary">
                            취소
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- 폼 유효성 검사 스크립트 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            const titleInput = document.getElementById('title');
            const contentTextarea = document.getElementById('content');

            form.addEventListener('submit', function(e) {
                // 제목 검사
                if (titleInput.value.trim() === '') {
                    e.preventDefault();
                    alert('제목을 입력해주세요.');
                    titleInput.focus();
                    return;
                }

                // 내용 검사
                if (contentTextarea.value.trim() === '') {
                    e.preventDefault();
                    alert('내용을 입력해주세요.');
                    contentTextarea.focus();
                    return;
                }

                // 제목 길이 검사
                if (titleInput.value.length > 200) {
                    e.preventDefault();
                    alert('제목은 200자 이내로 입력해주세요.');
                    titleInput.focus();
                    return;
                }

                // 수정 확인
                if (!confirm('공지사항을 수정하시겠습니까?')) {
                    e.preventDefault();
                    return;
                }
            });

            // 실시간 글자 수 표시
            titleInput.addEventListener('input', function() {
                const currentLength = this.value.length;
                const maxLength = 200;
                
                // 기존 글자수 표시 제거
                const existingCounter = document.querySelector('.title-counter');
                if (existingCounter) {
                    existingCounter.remove();
                }
                
                // 새 글자수 표시 추가
                if (currentLength > 0) {
                    const counter = document.createElement('div');
                    counter.className = 'form-text title-counter';
                    counter.textContent = `${currentLength}/${maxLength}자`;
                    if (currentLength > maxLength) {
                        counter.style.color = '#dc3545';
                    }
                    titleInput.parentNode.appendChild(counter);
                }
            });
        });
    </script>

</div>
