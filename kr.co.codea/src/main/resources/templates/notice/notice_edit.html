<div th:fragment="contentFragment">

    <th:block th:fragment="headFragment">
        <style>
            body {
                min-height: 100vh;
                background: #f8f9fa;
            }
            .main-content {
                max-width: 1000px;
                margin: 0 auto;
                padding: 64px 0.75rem 0;
            }
            .edit-form {
                background: #fff;
                border-radius: 0.5rem;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03);
                padding: 2rem;
            }
            .form-label {
                font-weight: 600;
                color: #333;
            }
            .content-textarea {
                min-height: 400px;
                resize: vertical;
            }
            .form-actions {
                display: flex;
                justify-content: center;
                gap: 1rem;
                margin-top: 2rem;
                padding-top: 1.5rem;
                border-top: 1px solid #e9ecef;
            }
            .notice-info {
                background: #f8f9fa;
                border-radius: 0.375rem;
                padding: 1rem;
                margin-bottom: 1.5rem;
                border-left: 4px solid #0d6efd;
            }
            @media (max-width: 767.98px) {
                .main-content { padding: 64px 0.3rem 0; }
                .edit-form { padding: 1.5rem; }
                .form-actions {
                    flex-direction: column;
                }
            }
        </style>
    </th:block>

    <main class="main-content">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0">
                    <i class="bi bi-pencil text-warning me-2"></i>
                    공지사항 수정
                </h2>
            </div>

            <!-- 기존 공지사항 정보 -->
            <div class="notice-info">
                <div class="row">
                    <div class="col-md-6">
                        <small class="text-muted">작성일:</small>
                        <div th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd HH:mm')}"></div>
                    </div>
                    <div class="col-md-6">
                        <small class="text-muted">조회수:</small>
                        <div th:text="${notice.views}"></div>
                    </div>
                </div>
            </div>

            <div class="edit-form">
                <form th:action="@{/notice/{id}/edit(id=${notice.noticeId})}" method="post" th:object="${notice}">
                    <!-- 제목 수정 -->
                    <div class="mb-4">
                        <label for="title" class="form-label">
                            <i class="bi bi-card-heading me-1"></i>
                            제목
                        </label>
                        <input type="text" 
                               class="form-control" 
                               id="title" 
                               name="title"
                               th:field="*{title}"
                               placeholder="공지사항 제목을 입력하세요"
                               required 
                               maxlength="200" />
                    </div>

                    <!-- 내용 수정 -->
                    <div class="mb-4">
                        <label for="content" class="form-label">
                            <i class="bi bi-text-paragraph me-1"></i>
                            내용
                        </label>
                        <textarea class="form-control content-textarea" 
                                  id="content" 
                                  name="content"
                                  th:field="*{content}"
                                  placeholder="공지사항 내용을 입력하세요"
                                  required></textarea>
                        <div class="form-text">
                            <i class="bi bi-info-circle me-1"></i>
                            줄바꿈은 자동으로 적용됩니다.
                        </div>
                    </div>

                    <!-- 수정자 정보 (읽기 전용) -->
                    <div class="mb-4">
                        <label class="form-label">
                            <i class="bi bi-person-circle me-1"></i>
                            수정자
                        </label>
                        <input type="text" 
                               class="form-control" 
                               value="관리자" 
                               readonly />
                    </div>

                    <!-- 버튼 영역 -->
                    <div class="form-actions">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="bi bi-check-lg me-1"></i>
                            수정하기
                        </button>
                        <a th:href="@{/notice/{id}(id=${notice.noticeId})}" 
                           class="btn btn-outline-secondary btn-lg">
                            <i class="bi bi-x-lg me-1"></i>
                            취소
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- 폼 유효성 검사 스크립트 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            const titleInput = document.getElementById('title');
            const contentTextarea = document.getElementById('content');

            form.addEventListener('submit', function(e) {
                // 제목 검사
                if (titleInput.value.trim() === '') {
                    e.preventDefault();
                    alert('제목을 입력해주세요.');
                    titleInput.focus();
                    return;
                }

                // 내용 검사
                if (contentTextarea.value.trim() === '') {
                    e.preventDefault();
                    alert('내용을 입력해주세요.');
                    contentTextarea.focus();
                    return;
                }

                // 제목 길이 검사
                if (titleInput.value.length > 200) {
                    e.preventDefault();
                    alert('제목은 200자 이내로 입력해주세요.');
                    titleInput.focus();
                    return;
                }

                // 수정 확인
                if (!confirm('공지사항을 수정하시겠습니까?')) {
                    e.preventDefault();
                    return;
                }
            });

            // 실시간 글자 수 표시
            titleInput.addEventListener('input', function() {
                const currentLength = this.value.length;
                const maxLength = 200;
                
                // 기존 글자수 표시 제거
                const existingCounter = document.querySelector('.title-counter');
                if (existingCounter) {
                    existingCounter.remove();
                }
                
                // 새 글자수 표시 추가
                if (currentLength > 0) {
                    const counter = document.createElement('div');
                    counter.className = 'form-text title-counter';
                    counter.textContent = `${currentLength}/${maxLength}자`;
                    if (currentLength > maxLength) {
                        counter.style.color = '#dc3545';
                    }
                    titleInput.parentNode.appendChild(counter);
                }
            });
        });
    </script>

</div>
