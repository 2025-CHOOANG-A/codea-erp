<div th:fragment="contentFragment">

    <th:block th:fragment="headFragment">
        <style>
            body {
                min-height: 100vh;
                background: #ffffff;
            }

            .filter-bar {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem 1rem;
                align-items: center;
                margin-bottom: 1.5rem;
                background: #fff;
                padding: 1rem 1.2rem;
                border-radius: 0.5rem;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03);
            }
            .filter-bar .form-control, .filter-bar .form-select {
                min-width: 140px;
                max-width: 220px;
            }
            .table-responsive {
                background: #fff;
                border-radius: 0.5rem;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03);
                margin-bottom: 1.5rem;
            }
            .table th {
                background: #f8f9fa;
                font-weight: 600;
                border-top: none;
            }
            .table td {
                vertical-align: middle;
            }
            .notice-title {
                color: #333;
                text-decoration: none;
                font-weight: 500;
            }
            .notice-title:hover {
                color: #0d6efd;
                text-decoration: underline;
            }
            .table-footer-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-top: 1rem;
            }
            .pagination {
                margin-bottom: 0;
            }
            @media (max-width: 767.98px) {
                .main-content { padding: 64px 0.3rem 0; }
                .filter-bar { 
                    flex-direction: column; 
                    gap: 0.5rem;
                }
                .filter-bar .form-control, .filter-bar .form-select {
                    min-width: 100%;
                }
            }
        </style>
    </th:block>

    <main class="main-content">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0">
                    공지사항
                </h2>
                <!-- 관리자만 작성 버튼 표시 -->
                <div th:if="${isAdmin}">
                    <a href="/notice/write" class="btn btn-primary">
                        <i class="bi bi-plus-lg"></i> 공지사항 작성
                    </a>
                </div>
            </div>

            <!-- 검색 필터 -->
            <form id="searchForm" class="filter-bar">
                <div class="d-flex align-items-center gap-2">
                    <label for="keyword" class="text-nowrap">검색:</label>
                    <input type="text" 
                           name="keyword" 
                           id="keyword"
                           class="form-control" 
                           placeholder="제목, 내용 검색"
                           th:value="${searchDto.keyword}" />
                </div>

                <div class="d-flex align-items-center gap-2">
                    <label for="startDate" class="text-nowrap">기간:</label>
                    <input type="date" 
                           name="startDate" 
                           id="startDate"
                           class="form-control"
                           th:value="${searchDto.startDate}" />
                </div>

                <div class="d-flex align-items-center gap-2">
                    <label for="endDate" class="text-nowrap">~</label>
                    <input type="date" 
                           name="endDate" 
                           id="endDate"
                           class="form-control"
                           th:value="${searchDto.endDate}" />
                </div>

                <div class="d-flex align-items-center gap-2">
                    <label for="pageSize" class="text-nowrap">페이지:</label>
                    <select name="size" id="pageSize" class="form-select">
                        <option value="10" th:selected="${pageInfo?.pageSize == 10}">10개</option>
                        <option value="20" th:selected="${pageInfo?.pageSize == 20}">20개</option>
                        <option value="50" th:selected="${pageInfo?.pageSize == 50}">50개</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-search"></i> 검색
                </button>
            </form>

            <!-- 페이지 정보 -->
            <div class="d-flex justify-content-between align-items-center mb-3" th:if="${pageInfo != null}">
                <div class="text-muted">
                    <span th:text="|총 ${pageInfo.total}건|"></span>
                </div>
                <div class="text-muted">
                    <span th:text="|${pageInfo.pageNum}/${pageInfo.pages} 페이지|"></span>
                </div>
            </div>

            <!-- 공지사항 목록 -->
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th style="width: 80px;" class="text-center">번호</th>
                            <th>제목</th>
                            <th style="width: 120px;" class="text-center">작성자</th>
                            <th style="width: 140px;" class="text-center">작성일</th>
                            <th style="width: 80px;" class="text-center">조회수</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${notices.isEmpty()}">
                            <td colspan="5" class="text-center text-muted py-5">
                                등록된 공지사항이 없습니다.
                            </td>
                        </tr>
                        <tr th:each="notice, i : ${notices}" th:unless="${notices.isEmpty()}">
                            <td class="text-center" 
                                th:text="${pageInfo.total - (pageInfo.pageNum - 1) * pageInfo.pageSize - i.index}">
                            </td>
                            <td>
                                <a th:href="@{/notice/{id}(id=${notice.noticeId})}" 
                                   class="notice-title"
                                   th:text="${notice.title}">
                                </a>
                            </td>
                            <td class="text-center" th:text="${notice.authorName ?: '관리자'}"></td>
                            <td class="text-center" 
                                th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd')}">
                            </td>
                            <td class="text-center" th:text="${notice.views}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 페이징 및 버튼 -->
            <div class="table-footer-row">
                <!-- 왼쪽: 목록 버튼 -->
                <div>
                    <a href="/notice/list" class="btn btn-outline-secondary">
                        <i class="bi bi-list"></i> 목록
                    </a>
                </div>

                <!-- 가운데: 페이징 -->
                <nav aria-label="공지사항 페이지네이션" th:if="${pageInfo != null}">
                    <ul class="pagination mb-0">
                        <!-- 첫 페이지 -->
                        <li class="page-item" th:classappend="${!pageInfo.hasPreviousPage} ? 'disabled'">
                            <a class="page-link" 
                               th:href="@{/notice/list(page=1, size=${pageInfo.pageSize}, keyword=${searchDto.keyword}, startDate=${searchDto.startDate}, endDate=${searchDto.endDate})}"
                               th:unless="${!pageInfo.hasPreviousPage}">
                                <i class="bi bi-chevron-double-left"></i>
                            </a>
                            <span class="page-link" th:if="${!pageInfo.hasPreviousPage}">
                                <i class="bi bi-chevron-double-left"></i>
                            </span>
                        </li>

                        <!-- 이전 페이지 -->
                        <li class="page-item" th:classappend="${!pageInfo.hasPreviousPage} ? 'disabled'">
                            <a class="page-link" 
                               th:href="@{/notice/list(page=${pageInfo.prePage}, size=${pageInfo.pageSize}, keyword=${searchDto.keyword}, startDate=${searchDto.startDate}, endDate=${searchDto.endDate})}"
                               th:unless="${!pageInfo.hasPreviousPage}">
                                <i class="bi bi-chevron-left"></i>
                            </a>
                            <span class="page-link" th:if="${!pageInfo.hasPreviousPage}">
                                <i class="bi bi-chevron-left"></i>
                            </span>
                        </li>

                        <!-- 페이지 번호들 -->
                        <li class="page-item" 
                            th:each="pageNum : ${pageInfo.navigatepageNums}"
                            th:classappend="${pageNum == pageInfo.pageNum} ? 'active'">
                            <a class="page-link" 
                               th:href="@{/notice/list(page=${pageNum}, size=${pageInfo.pageSize}, keyword=${searchDto.keyword}, startDate=${searchDto.startDate}, endDate=${searchDto.endDate})}"
                               th:text="${pageNum}"
                               th:unless="${pageNum == pageInfo.pageNum}">
                            </a>
                            <span class="page-link" th:if="${pageNum == pageInfo.pageNum}" th:text="${pageNum}"></span>
                        </li>

                        <!-- 다음 페이지 -->
                        <li class="page-item" th:classappend="${!pageInfo.hasNextPage} ? 'disabled'">
                            <a class="page-link" 
                               th:href="@{/notice/list(page=${pageInfo.nextPage}, size=${pageInfo.pageSize}, keyword=${searchDto.keyword}, startDate=${searchDto.startDate}, endDate=${searchDto.endDate})}"
                               th:unless="${!pageInfo.hasNextPage}">
                                <i class="bi bi-chevron-right"></i>
                            </a>
                            <span class="page-link" th:if="${!pageInfo.hasNextPage}">
                                <i class="bi bi-chevron-right"></i>
                            </span>
                        </li>

                        <!-- 마지막 페이지 -->
                        <li class="page-item" th:classappend="${!pageInfo.hasNextPage} ? 'disabled'">
                            <a class="page-link" 
                               th:href="@{/notice/list(page=${pageInfo.pages}, size=${pageInfo.pageSize}, keyword=${searchDto.keyword}, startDate=${searchDto.startDate}, endDate=${searchDto.endDate})}"
                               th:unless="${!pageInfo.hasNextPage}">
                                <i class="bi bi-chevron-double-right"></i>
                            </a>
                            <span class="page-link" th:if="${!pageInfo.hasNextPage}">
                                <i class="bi bi-chevron-double-right"></i>
                            </span>
                        </li>
                    </ul>
                </nav>

                <!-- 오른쪽: 작성 버튼 -->
                <div>
                    <!-- 관리자만 작성 버튼 표시 -->
                    <div th:if="${isAdmin}">
                        <a href="/notice/write" class="btn btn-primary">
                            <i class="bi bi-plus-lg"></i> 공지사항 작성
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 검색 폼 스크립트 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchForm = document.getElementById('searchForm');
            const pageSizeSelect = document.getElementById('pageSize');
            
            // 폼 제출시 페이지를 1로 리셋
            searchForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const formData = new FormData(searchForm);
                const params = new URLSearchParams();
                
                // 검색 조건들 추가
                for (let [key, value] of formData.entries()) {
                    if (value.trim() !== '') {
                        params.append(key, value);
                    }
                }
                
                // 검색시엔 항상 첫 페이지로
                params.set('page', '1');
                
                // 페이지 이동
                window.location.href = '/notice/list?' + params.toString();
            });
            
            // 페이지 크기 변경시 자동 검색
            pageSizeSelect.addEventListener('change', function() {
                searchForm.dispatchEvent(new Event('submit'));
            });
        });
    </script>

</div>
