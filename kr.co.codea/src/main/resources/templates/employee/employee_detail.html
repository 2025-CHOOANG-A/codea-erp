<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>사원 상세 정보 - CodeA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      min-height: 100vh;
      background-color: #f8f9fa;
    }

    .sidebar {
      width: 260px;
      background: #343a40;
      color: #fff;
      position: fixed;
      height: 100vh;
    }

    .sidebar .nav-link {
      color: #adb5bd;
    }

    .sidebar .nav-link.active,
    .sidebar .nav-link:hover {
      background: #495057;
      color: #fff;
    }

    .sidebar .menu-title {
      padding: 0.8rem 1.5rem 0.3rem;
      color: #ced4da;
    }

    .header {
      height: 64px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #dee2e6;
    }

    .header .logo {
      font-size: 1.7rem;
      font-weight: bold;
      color: #343a40;
      text-decoration: none;
    }

    .main-content-wrapper {
      margin-left: 80px;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .profile-table th {
      width: 30%;
      background: #f8f9fa;
      color: #6c757d;
    }

    .profile-table td,
    .profile-table th {
      vertical-align: middle;
    }

    .admin-info-table th {
      width: 30%;
      background: #f8f9fa;
      color: #6c757d;
    }
  </style>
</head>
<body>

  <header class="header">
    <a th:href="@{/index}" class="logo">CodeA</a>
  </header>

  <div class="main-content-wrapper" th:if="${employeeView != null && employeeView.generalInfo != null}">
    <div class="container" style="max-width: 700px;">
      <div class="card shadow-sm mb-4">
        <div class="card-header bg-white border-bottom-0 text-center">
          <h4 class="fw-bold mt-3"
              th:text="${(employeeView.accountInfo?.empName != null ? employeeView.accountInfo.empName : employeeView.generalInfo.empName) + ' 님의 프로필'}">
            사원 프로필
          </h4>
        </div>
        <div class="card-body">
          <h5>기본 정보</h5>
          <table class="table table-bordered profile-table mb-4" th:object="${employeeView.generalInfo}">
            <tbody>
              <tr><th>이름</th><td th:text="*{empName}">홍길동</td></tr>
              <tr><th>사원번호</th><td th:text="*{empNo}">EMP001</td></tr>
              <tr><th>부서</th><td th:text="*{empDept}">영업팀</td></tr>
              <tr><th>직책</th><td th:text="*{empPosition}">과장</td></tr>
              <tr><th>이메일</th><td th:text="*{email}">hong@codea.com</td></tr>
              <tr><th>내선번호</th><td th:text="*{tel}">1234</td></tr>
              <tr th:if="*{hp != null}"><th>전화번호</th><td th:text="*{hp}">010-1234-5678</td></tr>
            </tbody>
          </table>

          <div sec:authorize="hasRole('ADMIN')" th:if="${employeeView.accountInfo != null}">
            <hr>
            <h5>계정 정보 (관리자용)</h5>
            <table class="table table-bordered admin-info-table" th:object="${employeeView.accountInfo}">
              <tbody>
                <tr>
                  <th>계정 권한</th>
                  <td>
                    <span th:each="auth, iterStat : *{authorities}"
                          th:text="${auth.authority} + (${iterStat.last} ? '' : ', ')">ROLE_USER</span>
                  </td>
                </tr>
                <tr>
                  <th>계정 활성 상태</th>
                  <td th:text="*{enabled} ? '활성' : '비활성'">활성</td>
                </tr>
                <tr th:if="*{empUserId != null}">
                  <th>로그인 ID</th>
                  <td th:text="*{empUserId}"></td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="d-flex justify-content-end gap-2 mt-4">
            <th:block th:if="${canEdit}">
              <a th:href="@{/employee/{empId}/edit(empId=${employeeView.generalInfo.empId})}"
                 class="btn btn-sm btn-outline-primary">수정</a>
            </th:block>
            <th:block sec:authorize="hasRole('ROLE_ADMIN')">
              <form th:action="@{/employee/{empId}/delete(empId=${employeeView.generalInfo.empId})}"
                    method="post" style="display: inline;"
                    onsubmit="return confirm('정말로 이 사원을 삭제하시겠습니까?');">
                <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
              </form>
            </th:block>
            <a th:href="@{/employee}" class="btn btn-secondary">목록</a>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
