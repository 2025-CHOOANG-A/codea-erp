<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>사원 정보 수정 - CodeA</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet" />
<style>
body {
	min-height: 100vh;
	background-color: #f8f9fa;
}

.header {
	height: 64px;
	background: #fff;
	border-bottom: 1px solid #dee2e6;
	display: flex;
	align-items: center;
	justify-content: center;
}

.logo {
	font-size: 1.7rem;
	font-weight: 700;
	color: #343a40;
	text-decoration: none;
}

.main-content-wrapper {
	padding-top: 2rem;
	padding-bottom: 2rem;
}

.form-label {
	font-weight: 500;
}

.password-match-success {
	color: #28a745;
	font-size: 0.875rem;
	margin-top: 0.25rem;
}

.password-match-error {
	color: #dc3545;
	font-size: 0.875rem;
	margin-top: 0.25rem;
}
</style>
</head>
<body>
	<header class="header">
		<a th:href="@{/index}" class="logo">CodeA</a>
	</header>

	<div class="main-content-wrapper">
		<div class="container" style="max-width: 700px;">
			<div class="card shadow-sm mb-4">
				<div class="card-header bg-white border-bottom-0 text-center">
					<h4 class="fw-bold mt-3" th:text="${pageTitle ?: '사원 정보 수정'}">사원
						정보 수정</h4>
				</div>
				<div class="card-body p-4">
					<div th:if="${successMessage}"
						class="alert alert-success alert-dismissible fade show"
						role="alert">
						<span th:text="${successMessage}"></span>
						<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
					</div>
					<div th:if="${errorMessage}"
						class="alert alert-danger alert-dismissible fade show"
						role="alert">
						<span th:text="${errorMessage}"></span>
						<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
					</div>

					<form
						th:action="@{/employee/{empId}/edit(empId=${employeeDto.empId})}"
						th:object="${employeeDto}" method="post" autocomplete="off">

						<div class="mb-3 row">
							<label class="col-sm-3 col-form-label form-label">사원번호</label>
							<div class="col-sm-9">
								<input type="text" class="form-control-plaintext"
									th:value="*{empNo}" readonly />
							</div>
						</div>


						<div class="mb-3 row">
							<label class="col-sm-3 col-form-label form-label">이름</label>
							<div class="col-sm-9">
								<input type="text" class="form-control-plaintext"
									th:value="*{empName}" readonly />
							</div>
						</div>

						<div class="mb-3 row">
							<label for="email" class="col-sm-3 col-form-label form-label">이메일</label>
							<div class="col-sm-9">
								<input type="text" th:field="*{email}" class="form-control"
									id="email" th:disabled="${!(isAdmin or isEditingSelf)}" />
								<div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"
									class="text-danger small"></div>
							</div>
						</div>

						<div class="mb-3 row">
							<label for="hp" class="col-sm-3 col-form-label form-label">전화번호</label>
							<div class="col-sm-9">
								<input type="text" class="form-control" id="hp" th:field="*{hp}"
									th:disabled="${!(isAdmin or isEditingSelf)}" />
								<div th:if="${#fields.hasErrors('hp')}" th:errors="*{hp}"
									class="text-danger small"></div>
							</div>
						</div>

						<div class="mb-3 row">
							<label for="empDept" class="col-sm-3 col-form-label form-label">부서</label>
							<div class="col-sm-9">
								<select class="form-select" id="empDept" th:field="*{empDept}"
									th:disabled="${!isAdmin}">
									<option value="">부서 선택</option>
									<option value="영업부">영업부</option>
									<option value="생산부">생산부</option>
									<option value="구매부">구매부</option>
									<option value="자재부">자재부</option>
									<option value="관리부">관리부</option>
									<option value="개발부">개발부</option>
								</select>
							</div>
						</div>

						<div class="mb-3 row">
							<label for="empPosition"
								class="col-sm-3 col-form-label form-label">직책</label>
							<div class="col-sm-9">
								<select class="form-select" id="empPosition"
									th:field="*{empPosition}" th:disabled="${!isAdmin}">
									<option value="">직책 선택</option>
									<option value="사원">사원</option>
									<option value="주임">주임</option>
									<option value="대리">대리</option>
									<option value="과장">과장</option>
									<option value="차장">차장</option>
									<option value="부장">부장</option>
									<option value="팀장">팀장</option>
									<option value="실장">실장</option>
									<option value="이사">이사</option>
									<option value="상무">상무</option>
									<option value="전무">전무</option>
									<option value="부사장">부사장</option>
									<option value="사장">사장</option>
								</select>
							</div>
						</div>

						<div class="mb-3 row">
							<label for="tel" class="col-sm-3 col-form-label form-label">내선번호</label>
							<div class="col-sm-9">
								<input type="text" class="form-control" id="tel"
									th:field="*{tel}" th:disabled="${!isAdmin}" />
							</div>
						</div>

						<div th:if="${isAdmin}">
							<hr class="my-4">
							<h5>계정 정보 (관리자용)</h5>
							<div class="mb-3 row">
								<label class="col-sm-3 col-form-label form-label">계정 권한</label>
								<div class="col-sm-9">
									<select class="form-select" name="adminCode">
										<option value="" th:selected="${currentAdminCode == null}">일반
											사용자 (ROLE_USER)</option>
										<option value="ADMIN"
											th:selected="${currentAdminCode == 'ADMIN'}">관리자
											(ROLE_ADMIN)</option>
									</select>
								</div>
							</div>
							<div class="mb-3 row">
								<label class="col-sm-3 col-form-label form-label">계정 활성
									상태</label>
								<div class="col-sm-9">
									<select class="form-select" name="empStatus">
										<option value="true" th:selected="${currentEmpStatus == true}">활성</option>
										<option value="false"
											th:selected="${currentEmpStatus == false}">비활성</option>
									</select>
								</div>
							</div>
						</div>

						<div th:if="${isAdmin or isEditingSelf}">
							<hr class="my-4">
							<h5>비밀번호 재설정</h5>
							<div class="mb-3 row">
								<label class="col-sm-3 col-form-label form-label">새 비밀번호</label>
								<div class="col-sm-9">
									<input type="password" class="form-control" name="newPassword"
										id="newPassword" />
								</div>
							</div>
							<div class="mb-3 row">
								<label class="col-sm-3 col-form-label form-label">비밀번호
									확인</label>
								<div class="col-sm-9">
									<input type="password" class="form-control"
										name="confirmPassword" id="confirmPassword" />
									<div id="passwordMatchMessage"></div>
								</div>
							</div>
						</div>

						<div class="d-flex justify-content-end gap-2 mt-4">
							<button type="submit" class="btn btn-primary">저장</button>
							<a th:href="@{/employee/{empId}(empId=${employeeDto.empId})}"
								class="btn btn-secondary">취소</a>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script>
    const newPasswordInput = document.getElementById('newPassword');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const passwordMatchMessage = document.getElementById('passwordMatchMessage');

    function checkPasswordMatch() {
        if (!newPasswordInput || !confirmPasswordInput || !passwordMatchMessage) return;

        const newPwd = newPasswordInput.value;
        const confirmPwd = confirmPasswordInput.value;

        if (newPwd === '' && confirmPwd === '') {
            passwordMatchMessage.textContent = '';
            passwordMatchMessage.className = '';
        } else if (newPwd === confirmPwd) {
            passwordMatchMessage.textContent = '비밀번호가 일치합니다.';
            passwordMatchMessage.className = 'password-match-success';
        } else {
            passwordMatchMessage.textContent = '비밀번호가 일치하지 않습니다.';
            passwordMatchMessage.className = 'password-match-error';
        }
    }

    if (newPasswordInput) newPasswordInput.addEventListener('input', checkPasswordMatch);
    if (confirmPasswordInput) confirmPasswordInput.addEventListener('input', checkPasswordMatch);
</script>
</body>
</html>
