<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>신규 사원 등록 - CodeA</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet" />
<style>
body {
	min-height: 100vh;
	background-color: #f8f9fa;
}

.header {
	height: 64px;
	background: #fff;
	border-bottom: 1px solid #dee2e6;
	display: flex;
	align-items: center;
	justify-content: center;
	position: sticky;
	top: 0;
	z-index: 1020;
}

.logo {
	font-size: 1.7rem;
	font-weight: 700;
	color: #343a40;
	text-decoration: none;
}

.main-content-wrapper {
	padding-top: 2rem;
	padding-bottom: 2rem;
}

.form-label {
	font-weight: 500;
}

.password-match-success {
	color: #28a745;
	font-size: 0.875rem;
	margin-top: 0.25rem;
}

.password-match-error {
	color: #dc3545;
	font-size: 0.875rem;
	margin-top: 0.25rem;
}
</style>
</head>
<body>
	<header class="header">
		<a th:href="@{/index}" class="logo">CodeA</a>
	</header>

	<div class="main-content-wrapper">
		<div class="container" style="max-width: 700px;">
			<div class="card shadow-sm mb-4">
				<div class="card-header bg-white border-bottom-0 text-center">
					<h4 class="fw-bold mt-3">신규 사원 등록</h4>
				</div>
				<div class="card-body p-4">
					<div th:if="${successMessage}"
						class="alert alert-success alert-dismissible fade show">
						<span th:text="${successMessage}"></span>
						<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
					</div>
					<div th:if="${errorMessage}"
						class="alert alert-danger alert-dismissible fade show">
						<span th:text="${errorMessage}"></span>
						<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
					</div>

					<form th:action="@{/employee/register}" th:object="${employeeDto}"
						method="post" autocomplete="off">
						<div th:if="${#fields.hasGlobalErrors()}"
							class="alert alert-danger">
							<p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
						</div>

						<div class="mb-3 row">
							<label class="col-sm-3 col-form-label form-label">로그인 ID<span
								class="text-danger">*</span></label>
							<div class="col-sm-9">
								<input type="text" class="form-control" th:field="*{empUserId}"
									required />
								<div th:if="${#fields.hasErrors('empUserId')}"
									th:errors="*{empUserId}" class="text-danger small"></div>
							</div>
						</div>

						<div class="mb-3 row">
							<label class="col-sm-3 col-form-label form-label">사원번호</label>
							<div class="col-sm-9">
								<input type="text" class="form-control" th:field="*{empNo}"
									th:value="${generatedEmployeeId}" readonly />
								<div th:if="${#fields.hasErrors('empNo')}" th:errors="*{empNo}"
									class="text-danger small"></div>
							</div>
						</div>


						<div class="mb-3 row">
							<label class="col-sm-3 col-form-label form-label">이름<span
								class="text-danger">*</span></label>
							<div class="col-sm-9">
								<input type="text" class="form-control" th:field="*{empName}"
									required />
								<div th:if="${#fields.hasErrors('empName')}"
									th:errors="*{empName}" class="text-danger small"></div>
							</div>
						</div>

						<!-- 이메일 -->
						<div class="mb-3 row">
							<label class="col-sm-3 col-form-label form-label">이메일<span
								class="text-danger">*</span></label>
							<div class="col-sm-9">
								<input type="email" class="form-control" th:field="*{email}"
									placeholder="예: example@email.com" required /> <small
									class="text-muted">@ 포함 이메일 형식으로 입력하세요.</small>
								<div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"
									class="text-danger small"></div>
							</div>
						</div>

						<div class="mb-3 row">
							<label class="col-sm-3 col-form-label form-label">비밀번호<span
								class="text-danger">*</span></label>
							<div class="col-sm-9">
								<input type="password" class="form-control" id="empPw"
									th:field="*{empPw}" required autocomplete="new-password" /> <small
									class="text-muted">8자 이상, 영문+숫자+특수문자 조합 권장</small>
								<div th:if="${#fields.hasErrors('empPw')}" th:errors="*{empPw}"
									class="text-danger small"></div>
							</div>
						</div>

						<div class="mb-3 row">
							<label class="col-sm-3 col-form-label form-label">비밀번호 확인<span
								class="text-danger">*</span></label>
							<div class="col-sm-9">
								<input type="password" class="form-control" id="confirmPassword"
									name="confirmPassword" required autocomplete="new-password" />
								<div id="passwordMatchMessage"></div>
							</div>
						</div>

						<!-- 전화번호 -->
						<div class="mb-3 row">
							<label class="col-sm-3 col-form-label form-label">전화번호</label>
							<div class="col-sm-9">
								<input type="text" class="form-control" th:field="*{hp}"
									placeholder="예: 010-1234-5678" /> <small class="text-muted">하이픈(-)
									포함된 형식으로 입력: 010-1234-5678</small>
								<div th:if="${#fields.hasErrors('hp')}" th:errors="*{hp}"
									class="text-danger small"></div>
							</div>
						</div>

						<div class="mb-3 row">
							<label class="col-sm-3 col-form-label form-label">부서<span
								class="text-danger">*</span></label>
							<div class="col-sm-9">
								<select class="form-select" th:field="*{empDept}" required>
									<option value="">부서 선택</option>
									<option value="영업부">영업부</option>
									<option value="생산부">생산부</option>
									<option value="구매부">구매부</option>
									<option value="자재부">자재부</option>
									<option value="관리부">관리부</option>
									<option value="개발부">개발부</option>
								</select>
								<div th:if="${#fields.hasErrors('empDept')}"
									th:errors="*{empDept}" class="text-danger small"></div>
							</div>
						</div>

						<div class="mb-3 row">
							<label class="col-sm-3 col-form-label form-label">직책<span
								class="text-danger">*</span></label>
							<div class="col-sm-9">
								<select class="form-select" th:field="*{empPosition}" required>
									<option value="">직책 선택</option>
									<option value="사원">사원</option>
									<option value="주임">주임</option>
									<option value="대리">대리</option>
									<option value="과장">과장</option>
									<option value="차장">차장</option>
									<option value="부장">부장</option>
									<option value="팀장">팀장</option>
									<option value="실장">실장</option>
									<option value="이사">이사</option>
									<option value="상무">상무</option>
									<option value="전무">전무</option>
									<option value="부사장">부사장</option>
									<option value="사장">사장</option>
								</select>
								<div th:if="${#fields.hasErrors('empPosition')}"
									th:errors="*{empPosition}" class="text-danger small"></div>
							</div>
						</div>

						<!-- 내선번호 -->
						<div class="mb-3 row">
							<label class="col-sm-3 col-form-label form-label">내선번호</label>
							<div class="col-sm-9">
								<input type="text" class="form-control" th:field="*{tel}"
									placeholder="예: 02-1234-5678" /> <small class="text-muted">하이픈(-) 포함 예: 02-1234-내선번호</small>
								<div th:if="${#fields.hasErrors('tel')}" th:errors="*{tel}"
									class="text-danger small"></div>
							</div>
						</div>

						<hr class="my-4">
						<h5>계정 정보 설정 (관리자용)</h5>

						<div class="mb-3 row">
							<label class="col-sm-3 col-form-label form-label">계정 권한</label>
							<div class="col-sm-9">
								<select class="form-select" th:field="*{adminCode}">
									<option value="">일반 사용자 (ROLE_USER)</option>
									<option value="ADMIN">관리자 (ROLE_ADMIN)</option>
								</select>
							</div>
						</div>

						<div class="mb-3 row">
							<label class="col-sm-3 col-form-label form-label">계정 활성
								상태</label>
							<div class="col-sm-9">
								<select class="form-select" th:field="*{empStatus}">
									<option th:value="true">활성</option>
									<option th:value="false">비활성</option>
								</select>
							</div>
						</div>

						<div class="d-flex justify-content-end gap-2 mt-4">
							<button type="submit" class="btn btn-primary">등록</button>
							<a th:href="@{/employee}" class="btn btn-secondary">취소</a>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		const empPwInput = document.getElementById('empPw');
		const confirmPasswordInput = document.getElementById('confirmPassword');
		const passwordMatchMessage = document
				.getElementById('passwordMatchMessage');

		function checkPasswordMatch() {
			const pwd = empPwInput.value;
			const confirm = confirmPasswordInput.value;
			if (pwd === '' && confirm === '') {
				passwordMatchMessage.textContent = '';
				passwordMatchMessage.className = '';
			} else if (pwd === confirm) {
				passwordMatchMessage.textContent = '비밀번호가 일치합니다.';
				passwordMatchMessage.className = 'password-match-success';
			} else {
				passwordMatchMessage.textContent = '비밀번호가 일치하지 않습니다.';
				passwordMatchMessage.className = 'password-match-error';
			}
		}

		empPwInput.addEventListener('input', checkPasswordMatch);
		confirmPasswordInput.addEventListener('input', checkPasswordMatch);
	</script>
</body>
</html>
