<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>제품 상세 정보 - CodeA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Bootstrap v5.3 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/sidebar.css}" />
     <link rel="stylesheet" th:href="@{/css/item_detail.css}" />
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />     
 
  </head>
  <body>
    <!-- Sidebar -->
  <div th:replace="~{fragments/sidebar :: layout}"></div>

    <!-- Main Content -->
    <main id="mainContent" class="main-content">
      <section class="detail-section">
        <h4 class="mb-4 fw-bold">제품 상세 정보</h4>
        <!-- 제품 정보 (세로 배치, 스크롤 없음) -->
        <div class="mb-4">
          <div class="mb-3 fw-semibold">제품 정보</div>
          <table class="table table-bordered detail-table align-middle mb-0">
            <tbody>
            <!--  
              <tr>
                <th>품번</th>
                <td>PRD-00123</td>
              </tr>
              -->
              <tr>
                <th>제품구분</th>
                <td th:text="${item.itemType}">제품</td>
              </tr>
              <tr >
                <th>제품코드</th>
                <td th:text="${item.itemCode}"></td>
              </tr>
              <tr>
                <th>대분류</th>
                <td th:text="${item.itemCatL}"></td>
              </tr>
              <tr>
                <th>소분류</th>
                <td th:text="${item.itemCatS}"></td>
              </tr>
              <tr>
                <th>제품명</th>
                <td th:text="${item.itemName}"></td>
              </tr>
              <tr>
                <th>규격</th>
                <td th:text="${item.spec}"></td>
              </tr>
              <tr>
                <th>단위</th>
                <td th:text="${item.unitcodeText}"></td>
              </tr>
              <tr>
                <th>단가</th>
                <td>25,000</td>
              </tr>
            </tbody>
          </table>
        </div>
        <!-- 거래처 정보 (세로 배치) -->
        <div class="mb-4">
          <div class="mb-3 fw-semibold">거래처 정보</div>
          <div class="scroll-area">
            <table class="table table-bordered detail-table align-middle mb-0">
              <tbody>
                <tr >
                  <th>거래처</th>
                  <td th:text="${item.bpName}"></td>
                </tr>
                <tr>
                  <th>거래처 코드</th>
                  <td th:text="${item.bpCode}"></td>
                </tr>
                <tr>
                  <th>거래처 전화번호</th>
                  <td th:text="${item.Tel}"></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        <!-- 비고 -->
        <div class="mt-4">
          <div class="mb-2 fw-semibold">비고</div>
          <div class="scroll-area">
            <table class="table table-bordered detail-table align-middle mb-0">
              <tbody>
                <tr>
                  <td style="height: 80px"th:text="${item.reMark}">
                    특이사항 없음. <br />추가 요청 시 담당자에게 문의 바랍니다.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        <!-- 하단 버튼 -->
        <div class="btn-group-bottom">
          <a id="btnList" href="/item/item_list"  class="btn btn-outline-secondary" >목록</a>
         <a  id="btnEdit" th:href="@{/item/item_edite(itemId=${item.itemId})}" class="btn btn-outline-primary" >수정</a>
     <form id="deleteForm" th:action="@{/item/item_delete}" method="post" style="display: none;">
     <input type="hidden" name="itemId" id="deleteItemCode" th:value="${item.itemId}"/>
    </form>
         <button type="button" id="btnDelete" class="btn btn-outline-danger">삭제</button>
        </div>
      </section>
    </main>

    <!-- Bootstrap JS & Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
    <script src="/js/item_detail.js?v=1"></script>
      <script th:src="@{/js/sidebar.js}"></script>
</html>
