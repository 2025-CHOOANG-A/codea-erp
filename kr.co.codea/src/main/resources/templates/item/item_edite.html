<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>제품 정보 입력/수정 - CodeA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Bootstrap 5.3 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
     <link rel="stylesheet" th:href="@{/css/sidebar.css}" />
     <link rel="stylesheet" th:href="@{/css/item_edite.css}" />
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />      
  </head>
  <body>
       <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: layout}"></div>

    <!-- Main Content Wrapper for Centering -->
    <div class="main-content-wrapper">
      <main class="main-content">
        <form id="productForm"   th:action="@{/item/item_editeok}"
      method="post" autocomplete="off">
          <!-- 제품 정보 -->
          <div class="form-section-title">제품 정보</div>
          <table class="table table-bordered align-middle table-form mb-4">
            <tbody>
              <tr>
                <th>제품코드 <span class="required">*</span></th>
                <td >
                 <input type="text"
                 class="form-control"
                 name="itemCode"
                 id="itemCode"
                 th:value="${item.itemCode}"
                 readonly />
                </td>
                <th>제품구분 <span class="required">*</span></th>
                <td>
                  <select class="form-select" id="itemType" name="itemType" required>
                  <option value="" th:selected="${item.itemType == null}">선택</option>
                  <option th:value="완제품" th:selected="${item.itemType == '완제품'}">완제품</option>
                  <option th:value="원자재" th:selected="${item.itemType == '원자재'}">원자재</option>
                  </select>
                </td>
              </tr>
              <tr>
                <th>대분류 <span class="required">*</span></th>
                <td th:each="cl:${calL}">
                <select class="form-select" name="itemCatL" id="itemCatL" required>
                    <option th:value="${item.itemCatL}" th:text="${item.itemCatL}">선택</option>
                    <option th:text="${cl.categoryId}"></option>
                  </select>
                <!-- 필요에 따라 더 추가하세요 -->
                </select>
                </td>
                <th>소분류 <span class="required">*</span></th>
                <td>
                   <select class="form-select" id="itemCatS" name="itemCatS"  required>
                    <option th:value="${item.itemCatS}" th:text="${item.itemCatS}">선택</option>
                    <option th:value="${cs.categoryId}" th:each="cs:${calS}" th:text="${cs.categoryId}">회로</option>
                  </select>
                </td>
              </tr>
              <tr>
                <th>제품명 <span class="required">*</span></th>
                <td>
                  <input
                    type="text"
                    class="form-control"
                    id="itemName"
                    name="itemName"
                    th:value="${item.itemName}"
                    required
                  />
                </td>
                <th>규격 <span class="required">*</span></th>
                <td>
                  <input type="text" class="form-control"  id="spec" name="spec"  th:value="${item.spec}" required />
                </td>
              </tr>
              <tr>
                <th>단위 <span class="required">*</span></th>
                <td >
                  <select class="form-select" id="unitCode" name="unitCode"  required>
                   <option  value="" disabled th:if="${item.unitCode == null}"> >선택</option>
                    <option th:each="uncd : ${uni_code}"
                        th:value="${uncd.codeId}"  
                        th:text="${uncd.Code}"         
                      th:selected="${uncd.codeId == item.unitCode}">
           </option>            
                  </select>
                </td>
                <th>단가 <span class="required"  >*</span></th>
                <td>
                  <input
                     type="number"
                     class="form-control"
                     min="0"
                     id="price" 
                     name="price"
                     th:value="${item.price}"
                    required
                  />
                </td>
              </tr>
            </tbody>
          </table>

          <!-- 거래처 정보 -->
          <div class="form-section-title">거래처 정보</div>
          <table class="table table-bordered align-middle table-form mb-4">
            <tbody>
              <tr>
                <th>거래처 <span class="required">*</span></th>
                <td>
                  <div class="input-group">
                    <input
                      type="text"
                      class="form-control"
                         id="bpName" name="bpName"
                          th:value="${item.bpName}"
                      placeholder="거래처 검색"
                      readonly
                      required
                    />
                    <button
                      type="button"
                      class="btn btn-outline-secondary"
                      id="searchClientBtn"
                    >
                      검색
                    </button>
                  </div>
                </td>
                <th>거래처 코드 <span class="required">*</span></th>
                <td>
                  <input
                    type="text"
                    class="form-control"
                    id="bpCode" name="bpCode" 
                    th:value="${item.bpCode}"
                    readonly
                    required
                  />
                </td>
              </tr>
              <tr>
                <th>거래처 전화번호 <span class="required">*</span></th>
                <td colspan="3">
                  <input
                    type="text"
                    class="form-control"
                   id="Tel" name="Tel"
                    th:value="${item.Tel}"
                    readonly
                    required
                  />
                </td>
              </tr>
            </tbody>
          </table>

          <!-- 비고 -->
          <div class="form-section-title">비고</div>
          <table class="table table-bordered align-middle table-form mb-4">
            <tbody>
              <tr>
                <th>비고</th>
                <td colspan="3">
                  <textarea
                    class="form-control"
                    id="remark" name="reMark" 
                    th:text="${item.reMark}"
                    rows="2"
                    placeholder="비고 내용을 입력하세요"
                  ></textarea>
                </td>
              </tr>
            </tbody>
          </table>

          <!-- 에러 메시지 -->
          <div
            id="formError"
            class="text-danger mb-3"
            style="display: none"
          ></div>

          <!-- 버튼 -->
          <div class="text-end mb-5">
            <button  type="submit" class="btn btn-primary" id="saveBtn" >수정</button>
            <button
              type="button"
              class="btn btn-secondary ms-2"
              onclick="window.location.reload()"
            >
              취소
            </button>
          </div>
        </form>
      </main>
    </div>

    <!-- 거래처 검색 모달 -->
    <div
      class="modal fade"
      id="clientSearchModal"
      tabindex="-1"
      aria-labelledby="clientSearchModalLabel"
      aria-hidden="true"

        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="clientSearchModalLabel">거래처 검색</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="닫기"
            ></button>
          </div>
          <div class="modal-body">
            <input
              type="text"
              class="form-control mb-3"
              id="clientSearchInput"
              placeholder="거래처명 입력"
            />
            <table class="table table-hover table-bordered mb-0">
              <thead>
                <tr>
                  <th>거래처명</th>
                  <th>코드</th>
                  <th>전화번호</th>
                </tr>
              </thead>
              <tbody id="clientSearchResult">
                <!-- 샘플 데이터 -->
                  <tr th:each="bp :${bp_list}"
                   th:attr="data-name=${bp.bpName}, data-code=${bp.bpCode}, data-phone=${bp.Tel}">
                  <td th:text ="${bp.bpName}"></td>
                  <td th:text ="${bp.bpCode}"></td>
                  <td th:text ="${bp.Tel}"></td>
                </tr>

            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS & Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
