<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>BOM 목록 | CodeA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/sidebar.css}" />
   	<link rel="stylesheet" th:href="@{/css/bom_list.css}" />

  </head>
  <body>
    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: layout}"></div>

    <!-- Main Content -->
    <main class="content">
      <div class="container"x>
        <h2 class="mb-4">BOM 목록</h2>
        <!-- Filter/Search Bar -->
           <!-- Filter/Search Bar -->
<!-- ================== ① 검색·정렬용 폼 ================== -->
<form id="filterForm" class="filter-bar" th:action="@{/bom/bom_list}" method="get">
  <!-- 1) 검색어 -->
  <input
    type="text"
    name="keyword"
    class="form-control"
    placeholder="검색어 입력"
    th:value="${keyword}"
  />

  <!-- 2) 숨겨진 필드: sortField, sortOrder, page, size -->
  <input type="hidden" name="sortField" th:value="${sortField}" />
  <input type="hidden" name="sortOrder" th:value="${sortOrder}" />
  <input type="hidden" name="page" th:value="${currentPage}" />
  <input type="hidden" name="size" th:value="${pageSize}" />

  <!-- 3) 검색 버튼 -->
  <button type="submit" class="btn btn-primary">검색</button>

  <!-- 4) 정렬 토글 버튼 -->
  <a
    th:href="@{/bom/bom_list(
               keyword=${keyword},
               page=1,
               size=${pageSize},
               sortField='bomCode',
               sortOrder=${(sortField=='bomCode' and sortOrder=='ASC') ? 'DESC' : 'ASC'}
             )}"
    class="btn btn-outline-secondary"
  >
    <span th:text="${
      (sortField=='bomCode' and sortOrder=='ASC')
        ? 'BOM코드 내림차순'
        : 'BOM코드 오름차순'
    }">정렬</span>
  </a>
</form>

<!-- Table -->
<div class="table-responsive">
  <table id="bomTable" class="table table-hover align-middle mb-0">
    <thead class="table-light">
      <tr>
        <th scope="col"><input type="checkbox" id="selectAll" /></th>
        <th scope="col">BOM 코드</th>
        <th scope="col">제품 코드</th>
        <th scope="col">제품 명</th>
        <th scope="col">자재 현황</th>
        <th scope="col">내용 확인</th>
      </tr>
    </thead>
    <tbody id="bomTableBody">
      <!-- 기존 BOM 항목들 - JavaScript로 그룹화 후 숨김 처리 -->
      <tr class="original-row" th:each="bom : ${select_bomList}" style="display: none;">
        <td><input type="checkbox" name="selected" th:value="${bom.bomCode}" /></td>
        <td th:text="${bom.bomCode}">BOM_CODE</td>
        <td th:text="${bom.productCode}">제품코드</td>
        <td th:text="${bom.productName}">제품명</td>
        <td th:text="${bom.materialCode}">자재코드</td>
        <td th:text="${bom.materialName}">자재명</td>
        <td th:text="${bom.spec}">규격</td>
        <td th:text="${bom.unitUnicode}">단위</td>
        <td th:text="${bom.price}">단가</td>
        <td th:text="${bom.quantity}">수량</td>
        <td>
          <a th:href="@{/bom/bom_detail(bomCode=${bom.bomCode})}" class="btn btn-outline-primary btn-sm">
            확인
          </a>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 원본 데이터 수집
    const originalRows = document.querySelectorAll('.original-row');
    const bomData = [];
    
    originalRows.forEach(row => {
        const cells = row.querySelectorAll('td');
        bomData.push({
            bomCode: cells[1].textContent.trim(),
            productCode: cells[2].textContent.trim(),
            productName: cells[3].textContent.trim(),
            materialCode: cells[4].textContent.trim(),
            materialName: cells[5].textContent.trim(),
            spec: cells[6].textContent.trim(),
            unitUnicode: cells[7].textContent.trim(),
            price: cells[8].textContent.trim(),
            quantity: cells[9].textContent.trim(),
            detailLink: cells[10].querySelector('a').href
        });
    });
    
    // BOM 코드별로 그룹화
    const groupedData = {};
    bomData.forEach(item => {
        const key = item.bomCode + '_' + item.productCode;
        if (!groupedData[key]) {
            groupedData[key] = {
                bomCode: item.bomCode,
                productCode: item.productCode,
                productName: item.productName,
                detailLink: item.detailLink,
                materials: []
            };
        }
        groupedData[key].materials.push({
            materialCode: item.materialCode,
            materialName: item.materialName,
            spec: item.spec,
            unitUnicode: item.unitUnicode,
            price: item.price,
            quantity: item.quantity
        });
    });
    
    // 새로운 테이블 바디 생성
    const tbody = document.getElementById('bomTableBody');
    tbody.innerHTML = '';
    
    Object.values(groupedData).forEach(group => {
        const row = document.createElement('tr');
        
        // 자재 현황 테이블 HTML 생성
        let materialsTableHtml = `
            <div class="material-info">
                <table class="table table-sm table-bordered mb-0">
                    <thead class="table-light">
                        <tr class="text-center">
                            <th scope="col">자재 코드</th>
                            <th scope="col">자재 명</th>
                            <th scope="col">규격</th>
                            <th scope="col">단위(EA)</th>
                            <th scope="col">단가</th>
                            <th scope="col">자재소요량</th>
                        </tr>
                    </thead>
                    <tbody>
        `;
        
        group.materials.forEach(material => {
            // 단가 포맷팅 (콤마 추가)
            const formattedPrice = parseInt(material.price).toLocaleString();
            materialsTableHtml += `
                <tr class="text-center">
                    <td>${material.materialCode}</td>
                    <td>${material.materialName}</td>
                    <td>${material.spec}</td>
                    <td>${material.unitUnicode}</td>
                    <td>${formattedPrice}</td>
                    <td>${material.quantity}</td>
                </tr>
            `;
        });
        
        materialsTableHtml += `
                    </tbody>
                </table>
            </div>
        `;
        
        row.innerHTML = `
            <td><input type="checkbox" name="selected" value="${group.bomCode}" /></td>
            <td>${group.bomCode}</td>
            <td><a href="#">${group.productCode}</a></td>
            <td>${group.productName}</td>
            <td>${materialsTableHtml}</td>
            <td>
                <a href="${group.detailLink}" class="btn btn-outline-primary btn-sm">
                    확인
                </a>
            </td>
        `;
        
        tbody.appendChild(row);
    });
});
</script>
