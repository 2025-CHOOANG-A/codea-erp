<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeA | 물류 · 생산 관리 ERP 시스템</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/sidebar.css" th:href="@{/css/sidebar.css}" />
  <style>
    body {
      min-height: 100vh;
      background: #f5f6fa;
      padding-top: 64px;
    }
    .main-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }
    
    /* 공통 카드 스타일 */
    .custom-card {
      border: none;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      background: #ffffff;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    
    /* 공지사항 카드 */
    .notice-card .card-header {
      background: #f8f9fa;
      border: none;
      border-bottom: 1px solid #e9ecef;
      padding: 0.75rem 1.25rem;
      color: #495057;
    }
    .notice-card .card-header h5 {
      margin: 0;
      font-weight: 600;
      font-size: 1rem;
    }
    .notice-card .btn-outline-primary {
      border: 1px solid #007bff;
      color: #007bff;
      font-size: 0.85rem;
      padding: 0.25rem 0.75rem;
      border-radius: 6px;
      font-weight: 500;
    }
    .notice-card .btn-outline-primary:hover {
      background: #007bff;
      border-color: #007bff;
      color: white;
    }
    
    .notice-card .table {
      margin: 0;
    }
    .notice-card .table th {
      background: #f8f9fa;
      font-weight: 600;
      border-top: none;
      border-bottom: 1px solid #e9ecef;
      text-align: center;
      padding: 0.6rem 0.5rem;
      font-size: 0.9rem;
      color: #495057;
    }
    .notice-card .table td {
      vertical-align: middle;
      font-size: 0.9rem;
      padding: 0.6rem 0.5rem;
      text-align: center;
      border-bottom: 1px solid #f1f3f4;
    }
    .notice-card .table td:nth-child(2) {
      text-align: left;
    }
    .notice-card .table tbody tr:hover {
      background: #f8f9fa;
    }
    .notice-card .table a {
      color: #2c3e50;
      text-decoration: none;
      font-weight: 500;
    }
    .notice-card .table a:hover {
      color: #495057;
    }
    
    /* 입고 카드 */
    .receiving-card .card-header {
      background: #007bff;
      border: none;
      padding: 0.75rem 1.25rem;
      color: white;
      font-weight: 600;
      font-size: 1rem;
    }
    
    /* 출고 카드 */
    .shipping-card .card-header {
      background: #6c757d;
      border: none;
      padding: 0.75rem 1.25rem;
      color: white;
      font-weight: 600;
      font-size: 1rem;
    }
    
    .inout-card .card-body {
      padding: 0;
    }
    .inout-card .table {
      margin: 0;
    }
    .inout-card .table th {
      background: #f8f9fa;
      font-weight: 600;
      border-top: none;
      border-bottom: 1px solid #e9ecef;
      font-size: 0.9rem;
      padding: 0.6rem 0.5rem;
      text-align: center;
      color: #495057;
    }
    .inout-card .table td {
      font-size: 0.9rem;
      padding: 0.6rem 0.5rem;
      text-align: center;
      border-bottom: 1px solid #f1f3f4;
      vertical-align: middle;
    }
    .inout-card .table tbody tr:hover {
      background: #f8f9fa;
    }
    
    @media (max-width: 991.98px) {
      .main-content { 
        max-width: 100%; 
        padding: 1rem 0.75rem;
      }
      .col-md-6 {
        margin-bottom: 1rem;
      }
    }
    
    @media (max-width: 767.98px) {
      .main-content { 
        padding: 1rem 0.5rem;
      }
      .notice-card .table th, 
      .notice-card .table td,
      .inout-card .table th, 
      .inout-card .table td { 
        font-size: 0.8rem; 
        padding: 0.5rem 0.3rem;
      }
    }
  </style>
</head>
<body>
  <!-- 사이드바 + 헤더 -->
  <div th:replace="~{fragments/sidebar :: layout}"></div>

  <div class="main-content">
    <!-- 공지사항 -->
    <div class="card custom-card notice-card">
      <div class="card-header d-flex align-items-center justify-content-between">
        <h5>공지사항</h5>
        <a href="/notice/list" class="btn btn-outline-primary">전체보기</a>
      </div>
      <div class="table-responsive">
        <table class="table mb-0">
          <thead>
            <tr>
              <th style="width:60px">번호</th>
              <th>제목</th>
              <th style="width:100px">작성자</th>
              <th style="width:110px">작성일</th>
              <th style="width:70px">조회수</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${recentNotices == null or #lists.isEmpty(recentNotices)}">
              <td colspan="5" class="text-center text-muted py-3">등록된 공지사항이 없습니다.</td>
            </tr>
            <tr th:each="notice, iterStat : ${recentNotices}" th:unless="${recentNotices == null or #lists.isEmpty(recentNotices)}">
              <td th:text="${#lists.size(recentNotices) - iterStat.index}"></td>
              <td>
                <a th:href="@{/notice/{id}(id=${notice.noticeId})}" 
                   th:text="${notice.title}">
                </a>
              </td>
              <td>관리자</td>
              <td th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd')}"></td>
              <td th:text="${notice.views}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 입출고 현황 -->
    <div class="row g-3">
      <!-- 입고 -->
      <div class="col-md-6">
        <div class="card custom-card inout-card receiving-card h-100">
          <div class="card-header">최근 입고</div>
          <div class="card-body">
            <table class="table table-hover mb-0">
              <thead>
                <tr>
                  <th>입고번호</th>
                  <th>일자</th>
                  <th>제품명</th>
                  <th>수량</th>
                  <th>창고</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="item : ${recentReceivingList}">
                  <td th:text="${item.inoutId}"></td>
                  <td th:text="${item.inoutTime.substring(0, 10)}"></td>
                  <td th:text="${item.itemName}"></td>
                  <td th:text="${item.quantity}"></td>
                  <td th:text="${item.whName}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(recentReceivingList)}">
                  <td colspan="5" class="text-center text-muted py-3">최근 입고 내역이 없습니다.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      
      <!-- 출고 -->
      <div class="col-md-6">
        <div class="card custom-card inout-card shipping-card h-100">
          <div class="card-header">최근 출고</div>
          <div class="card-body">
            <table class="table table-hover mb-0">
              <thead>
                <tr>
                  <th>출고번호</th>
                  <th>일자</th>
                  <th>제품명</th>
                  <th>수량</th>
                  <th>창고</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="item : ${recentShipmentList}">
                  <td th:text="${item.inoutId}"></td>
                  <td th:text="${item.inoutTime.substring(0, 10)}"></td>
                  <td th:text="${item.itemName}"></td>
                  <td th:text="${item.quantity}"></td>
                  <td th:text="${item.whName}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(recentShipmentList)}">
                  <td colspan="5" class="text-center text-muted py-3">최근 출고 내역이 없습니다.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
